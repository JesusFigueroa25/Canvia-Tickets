<div class="sidenav canvia-tokens" [ngClass]="collapsed ? 'sidenav-collapsed' : ''" role="navigation"
    aria-label="Navegación principal CANVIA">

    <div class="logo-container">
        <button type="button" class="logo" (click)="toggleCollapse()"
            [attr.aria-label]="collapsed ? 'Contraer menú' : 'Expandir menú'"
            [attr.aria-expanded]="collapsed" aria-controls="canvia-navigation"> C </button>
        <div class="logo-text" @fadeInOut *ngIf="collapsed"> Canvia </div>
        <button type="button" class="btn-close" @rotate *ngIf="collapsed" (click)="closeSidenav()" aria-label="Contraer menú">
            <span class="material-symbols-outlined close-icon" aria-hidden="true">
                close
            </span>
        </button>
    </div>

    <ul id="canvia-navigation" class="sidenav-nav">
        <li class="sidenav-nav-item" *ngFor="let data of navData">

            <!-- Opciones de navegación -->
            <a *ngIf="data.icon !== 'logout'" class="sidenav-nav-link" [routerLink]="['/', data.routeLink]"
                routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page"
                [attr.aria-label]="data.label" [title]="data.label">

                <span class="material-symbols-outlined sidenav-link-icon" aria-hidden="true">
                    {{ data.icon }}
                </span>
                <span class="sidenav-link-text" @fadeInOut *ngIf="collapsed">
                    {{ data.label }}
                </span>
            </a>

            <!-- Cerrar sesión -->
            <a *ngIf="data.icon === 'logout'" class="sidenav-nav-link" role="button" tabindex="0" (click)="logout()"
                [attr.aria-label]="data.label" [title]="data.label"
                (keydown.enter)="logout()" (keydown.space)="$event.preventDefault(); logout()">

                <span class="material-symbols-outlined sidenav-link-icon" aria-hidden="true">
                    {{ data.icon }}
                </span>
                <span class="sidenav-link-text" @fadeInOut *ngIf="collapsed">
                    {{ data.label }}
                </span>

            </a>
        </li>
    </ul>

</div>
