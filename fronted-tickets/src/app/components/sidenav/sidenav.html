<div class="sidenav" [ngClass]="collapsed ? 'sidenav-collapsed' : ''">

    <div class="logo-container">
        <button class="logo" (click)="toggleCollapse()"> C </button>
        <div class="logo-text" @fadeInOut *ngIf="collapsed"> Canvia </div>
        <button class="btn-close" @rotate *ngIf="collapsed" (click)="closeSidenav()">
            <span class="material-symbols-outlined close-icon">
                close
            </span>
        </button>
    </div>

    <ul class="sidenav-nav">
        <li class="sidenav-nav-item" *ngFor="let data of navData">

            <!-- Opciones de navegación -->
            <a *ngIf="data.icon !== 'logout'" class="sidenav-nav-link" [routerLink]="['/', data.routeLink]"
                routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">

                <span class="material-symbols-outlined sidenav-link-icon">
                    {{ data.icon }}
                </span>
                <span class="sidenav-link-text" @fadeInOut *ngIf="collapsed">
                    {{ data.label }}
                </span>
            </a>

            <!-- Cerrar sesión -->
            <a *ngIf="data.icon === 'logout'" class="sidenav-nav-link" role="button" tabindex="0" (click)="logout()"
                (keydown.enter)="logout()" (keydown.space)="$event.preventDefault(); logout()">

                <span class="material-symbols-outlined sidenav-link-icon">
                    {{ data.icon }}
                </span>
                <span class="sidenav-link-text" @fadeInOut *ngIf="collapsed">
                    {{ data.label }}
                </span>

            </a>
        </li>
    </ul>

</div>
