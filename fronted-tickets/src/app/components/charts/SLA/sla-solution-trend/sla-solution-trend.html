<section class="chart-card">
    <div class="chart-header">
        <div>
            <h2> SLA Solución: Tendencia</h2>
            <p> Evolución mensual del cumplimiento frente al objetivo.</p>
        </div>
    </div>

    <div class="chart-container">
        <canvas 
            baseChart 
            [data]="chartData" 
            [options]="chartOptions" 
            [plugins]="chartPlugins" 
            [type]="'line'">
        </canvas>
    </div>

</section>
