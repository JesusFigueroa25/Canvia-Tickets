<section class="chart-card">

    <!-- ENCABEZADO -->
    <div class="chart-header">
        <div class="chart-title">

            <h2>{{ titulo }}</h2>

            <p>{{ descripcion }}</p>

        </div>
        <!-- SELECCIONAR CANTIDAD DE RESOLUTORES -->
        <div class="resolver-limit-control">
            <label for="resolver-top-limit">Mostrar</label>

            <select id="resolver-top-limit" [value]="limite" [disabled]="cargando"
                (change)="cambiarLimite(+$any($event.target).value)">

                <option *ngFor="let opcion of opcionesLimite" [value]="opcion">
                    Top {{ opcion }}
                </option>

            </select>
        </div>
    </div>

    <!-- LEYENDA SOLO CON FILTROS -->

    <div class="chart-legend" *ngIf="datos && datos.periodos.length > 0">
        <div class="legend-item" *ngFor="let periodo of datos.periodos; let i = index">
            <span class="legend-color" [style.background-color]="colorPeriodo(i)">
            </span>
            <span>
                {{ periodo.periodo.replace('-', '/') }}
            </span>
        </div>
    </div>

    <!-- CARGA -->
    <div class="loading-message" *ngIf="cargando">
        <mat-icon>hourglass_top</mat-icon>
        Actualizando número de tickets por resolutor...
    </div>

    <!-- GRÁFICO -->
    <div class="chart-viewport" *ngIf="datos && datos.resolutores.length > 0 &&
               (!mostrarMesesEnEjeX || datos.periodos.length > 0)">

        <div class="chart-content" [class.is-loading]="cargando" [class.detail-mode]="mostrarMesesEnEjeX"
            [style.width]="mostrarMesesEnEjeX ? anchoGrafico + 'px' : '100%'"
            [style.min-width.px]="mostrarMesesEnEjeX ? null : anchoGrafico">

            <canvas baseChart [type]="chartType" [data]="chartData" [options]="chartOptions" [plugins]="chartPlugins">
            </canvas>

        </div>
    </div>

    <!-- SIN RESULTADOS -->
    <div class="no-data" *ngIf="!cargando && datos &&
               (datos.resolutores.length === 0 ||
               (mostrarMesesEnEjeX && datos.periodos.length === 0))">

        <mat-icon>bar_chart</mat-icon>

        <span>
            No se encontraron tickets por resolutor
            para los filtros seleccionados.
        </span>

    </div>

</section>
