
<section class="chart-card">
    <div class="chart-header">
        <div>
            <h2>
                Volumen Mensual de Operación - 2026
            </h2>
            <p>
                Comparación mensual de incidentes
                y requerimientos registrados en los consolidados.
            </p>
        </div>
    </div>


    <div class="chart-container">
        <canvas
            baseChart
            [data]="chartData"
            [options]="chartOptions"
            [type]="'bar'">
        </canvas>
    </div>

</section>
